<!DOCTYPE html>
<html lang="eng">
    <style>
        .AK-MEDIA {
            height: 150px;
            width: 100%;
            background-color: #3300FF;
            align-items: center;
            border-radius: 10px;
            display: flex;
            justify-content: center;
        }

        .AK-MEDIA-BUTTON {
            height: 100%;
            border: none;
            background-color: transparent;
        }

        .AK-MEDIA-IMG {
            height: 100%;
        }

        .NEWS {
            justify-content: left;
            display: flex;
            flex-direction: column;
            height: 550px;
        }

        .MARQUEE-A {
            display: flex;
            height: 39.2px;
            justify-content: right;
        }

        .MARQUEE-B {
            border: 1px solid black;
            height: 36px;
            width: 1300px;
            margin-top: 1px;
            font-size: 25px;
            font-family: Calafornia system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            border-radius: 10px;
        }

        .NEWS-CONTENT {
            height: 500px;
            width: 100%;
            background-color: whitesmoke;
            border: 1px solid black;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Adjusted wrapper container to leave space for the bottom controls */
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: calc(100% - 53px); /* Reserves space for .slider-controls */
            overflow: hidden;
        }

        .slider-track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            height: 100%;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            justify-content: center;
        }

        .image-side {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-side img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .slider-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 53px;
            padding: 10px;
            gap: 15px;
            border-top: 1px solid #eaeaea;
            background: #faf9f8;
            box-sizing: border-box;
        }

        .control-btn {
            background: transparent;
            border: 1px solid #ccc;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #e1dfdd;
            border-color: #b3b0ad;
        }

        .progress-bar-container {
            width: 120px;
            height: 4px;
            background: #d2d0c9;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #0067b8;
            transition: width linear;
        }
    </style>
    <body style="background-color: lightgray;">
        <title>
            www.AK-MEDIA.com
        </title>
        <div class="AK-MEDIA">
            <button class="AK-MEDIA-BUTTON">
                <img src="AK media.png" class="AK-MEDIA-IMG">
            </button>
        </div>
        <div class="NEWS">
            <div style="display: flex; flex-direction: row;">
                <H style="font-family: Century Gothic; font-size: xx-large;">LATEST NEWS</H>
                <div class="MARQUEE-A">
                    <marquee class="MARQUEE-B">
                        AK Community Connect's website: Local Voice, is live!
                    </marquee>
                </div>
            </div>
        <div class="NEWS-CONTENT">
            <div class="slider-wrapper">
                <div class="slider-track" id="sliderTrack">
                    <div class="slide">
                        <div class="image-side">
                            <img src="News-A.png" alt="Slide 1">
                        </div>
                    </div>
                    <div class="slide">
                        <div class="image-side">
                            <img src="News-B.png" alt="Slide 2">
                        </div>
                    </div>
                </div>
            </div>

            <div class="slider-controls">
                <button class="control-btn" id="prevBtn">&#8592;</button>
                <div class="progress-bar-container" id="progressBarContainer">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <button class="control-btn" id="nextBtn">&#8594;</button>
            </div>
        </div>
        </div>

        <script>
            const track = document.getElementById('sliderTrack');
            const slides = Array.from(track.children);
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            const progressFill = document.getElementById('progressFill');

            let currentIndex = 0;
            let slideInterval;
            const intervalTime = 5000;

            function updateSlide(index) {
                if (index < 0) {
                    currentIndex = slides.length - 1;
                } else if (index >= slides.length) {
                    currentIndex = 0;
                } else {
                    currentIndex = index;
                }

                track.style.transform = `translateX(-${currentIndex * 100}%)`;
                resetTimer();
            }

            function startTimer() {
                progressFill.style.transition = `width ${intervalTime}ms linear`;
                progressFill.style.width = '100%';

                slideInterval = setTimeout(() => {
                    updateSlide(currentIndex + 1);
                }, intervalTime);
            }

            function resetTimer() {
                clearTimeout(slideInterval);
                progressFill.style.transition = 'none';
                progressFill.style.width = '0%';
                
                setTimeout(() => {
                    startTimer();
                }, 50);
            }

            nextBtn.addEventListener('click', () => {
                updateSlide(currentIndex + 1);
            });

            prevBtn.addEventListener('click', () => {
                updateSlide(currentIndex - 1);
            });

            startTimer();
        </script>
    </body>
</html>
